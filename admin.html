<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TVEO Business | Administración de Proyectos</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #07111f;
      color: #ffffff;
    }

    .container {
      width: min(1100px, 94%);
      margin: 40px auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9ca9b8;
      margin-bottom: 30px;
    }

    .card {
      background: #101d2d;
      border: 1px solid #23364c;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: bold;
      color: #dce6f0;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 9px;
      border: 1px solid #30465e;
      background: #081522;
      color: white;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #4d8dcc;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: #1683d8;
      color: white;
    }

    .secondary {
      background: #26384c;
      color: white;
    }

    .danger {
      background: #a93434;
      color: white;
    }

    button:hover {
      opacity: .9;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: #123d29;
      color: #8ff0ba;
    }

    .message.error {
      background: #451c1c;
      color: #ffaaaa;
    }

    .project-image {
      margin-top: 12px;
      display: none;
    }

    .project-image img {
      width: 220px;
      height: 140px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #30465e;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #25384d;
    }

    th {
      color: #8db8dc;
    }

    .actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .small {
      padding: 8px 12px;
      font-size: 13px;
    }

    .empty {
      padding: 25px;
      text-align: center;
      color: #8c9bab;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>TVEO Business</h1>
  <div class="subtitle">
    Administración de proyectos inmobiliarios
  </div>

  <!-- FORMULARIO -->
  <div class="card">

    <h2 id="formTitle">Nuevo proyecto</h2>

    <div class="form-grid">

      <div class="field">
        <label for="prNombre">Nombre</label>
        <input
          id="prNombre"
          type="text"
          placeholder="Nombre del proyecto"
        >
      </div>

      <div class="field">
        <label for="prCategoria">Categoría</label>
        <input
          id="prCategoria"
          type="text"
          placeholder="Urbanización, residencial, casas..."
        >
      </div>

      <div class="field">
        <label for="prUbicacion">Ubicación</label>
        <input
          id="prUbicacion"
          type="text"
          placeholder="Ubicación del proyecto"
        >
      </div>

      <div class="field">
        <label for="prPrecio">Precio</label>
        <input
          id="prPrecio"
          type="text"
          placeholder="Ej. Desde Bs. 150.000"
        >
      </div>

      <div class="field">
        <label for="prWhatsapp">WhatsApp</label>
        <input
          id="prWhatsapp"
          type="text"
          placeholder="Número de WhatsApp"
        >
      </div>

      <div class="field">
        <label for="prEstado">Estado</label>

        <select id="prEstado">
          <option value="Publicado">Publicado</option>
          <option value="Borrador">Borrador</option>
          <option value="Oculto">Oculto</option>
        </select>
      </div>

      <div class="field">
        <label for="prImagen">
          Imagen principal
        </label>

        <input
          id="prImagen"
          type="file"
          accept="image/jpeg,image/png,image/webp"
        >

        <div id="imagenActual" class="project-image">
          <div style="margin-bottom:7px;color:#9ca9b8;">
            Imagen actual:
          </div>

          <img
            id="imagenActualPreview"
            src=""
            alt="Imagen actual del proyecto"
          >
        </div>
      </div>

      <div class="field">
        <label for="prDestacado">
          Proyecto destacado
        </label>

        <select id="prDestacado">
          <option value="false">No</option>
          <option value="true">Sí</option>
        </select>
      </div>

      <div class="field full">
        <label for="prDesc">
          Descripción corta
        </label>

        <textarea
          id="prDesc"
          placeholder="Descripción del proyecto..."
        ></textarea>
      </div>

    </div>

    <div class="buttons">

      <button
        id="saveProjectBtn"
        class="primary"
        type="button"
      >
        Guardar proyecto
      </button>

      <button
        id="cancelProjectBtn"
        class="secondary"
        type="button"
      >
        Cancelar
      </button>

      <button
        id="newProjectBtn"
        class="secondary"
        type="button"
      >
        Nuevo proyecto
      </button>

    </div>

    <div id="projectMsg" class="message"></div>

  </div>


  <!-- LISTADO -->
  <div class="card">

    <h2>Proyectos registrados</h2>

    <div class="table-wrapper">

      <table>

        <thead>
          <tr>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Ubicación</th>
            <th>Precio</th>
            <th>Estado</th>
            <th>Destacado</th>
            <th>Acciones</th>
          </tr>
        </thead>

        <tbody id="projectsTable">
        </tbody>

      </table>

    </div>

  </div>

</div>


<script>

  /*
   * =========================================================
   * CONFIGURACIÓN SUPABASE
   * =========================================================
   */

  const SUPABASE_URL =
    'https://jefvmwhkalypvrpiwcuj.supabase.co';

  const SUPABASE_KEY =
    'sb_publishable_yj7GqpJpBjtzemuSnke7mQ_bXzeReDy';


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /*
   * =========================================================
   * ESTADO
   * =========================================================
   */

  const moduleState = {
    projectEdit: null,
    projectImageOriginal: null
  };


  /*
   * =========================================================
   * UTILIDADES
   * =========================================================
   */

  function val(id) {

    const element =
      document.getElementById(id);

    return element?.value?.trim() || '';

  }


  function boolVal(id) {

    return (
      document.getElementById(id)?.value === 'true'
    );

  }


  function escapeHtml(value) {

    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  }


  function showMessage(
    message,
    type = 'success'
  ) {

    const element =
      document.getElementById('projectMsg');

    element.textContent = message;

    element.className =
      'message show ' + type;

  }


  function clearMessage() {

    const element =
      document.getElementById('projectMsg');

    element.textContent = '';

    element.className =
      'message';

  }


  /*
   * =========================================================
   * URL PÚBLICA DE IMAGEN
   * =========================================================
   */

  function publicImageUrl(path) {

    if (!path) {
      return '';
    }

    if (
      /^https?:\/\//i.test(path)
    ) {
      return path;
    }

    const result =
      supabaseClient
        .storage
        .from('inmobiliaria')
        .getPublicUrl(path);

    return result?.data?.publicUrl || '';

  }


  /*
   * =========================================================
   * SUBIR IMAGEN DEL PROYECTO
   * =========================================================
   */

  async function guardarImagenProyecto(file) {

    if (!file) {
      return null;
    }

    const extension =
      (
        file.name
          .split('.')
          .pop() || 'jpg'
      ).toLowerCase();

    const path =
      `proyectos/${Date.now()}-${Math.random()
        .toString(36)
        .slice(2, 9)}.${extension}`;


    const {
      error
    } =
      await supabaseClient
        .storage
        .from('inmobiliaria')
        .upload(
          path,
          file,
          {
            upsert: false,
            contentType: file.type
          }
        );


    if (error) {
      throw error;
    }


    return path;

  }


  /*
   * =========================================================
   * LIMPIAR FORMULARIO
   * =========================================================
   */

  function limpiarFormularioProyecto() {

    moduleState.projectEdit = null;

    moduleState.projectImageOriginal = null;


    document.getElementById('prNombre').value = '';

    document.getElementById('prCategoria').value = '';

    document.getElementById('prUbicacion').value = '';

    document.getElementById('prPrecio').value = '';

    document.getElementById('prWhatsapp').value = '';

    document.getElementById('prEstado').value =
      'Publicado';

    document.getElementById('prImagen').value = '';

    document.getElementById('prDestacado').value =
      'false';

    document.getElementById('prDesc').value = '';


    document.getElementById('formTitle').textContent =
      'Nuevo proyecto';


    ocultarImagenActual();

    clearMessage();

  }


  /*
   * =========================================================
   * MOSTRAR IMAGEN ACTUAL
   * =========================================================
   */

  function mostrarImagenActual(path) {

    const container =
      document.getElementById('imagenActual');

    const preview =
      document.getElementById(
        'imagenActualPreview'
      );


    const url =
      publicImageUrl(path);


    if (!url) {

      ocultarImagenActual();

      return;

    }


    preview.src = url;

    container.style.display = 'block';

  }


  function ocultarImagenActual() {

    const container =
      document.getElementById('imagenActual');

    const preview =
      document.getElementById(
        'imagenActualPreview'
      );

    preview.src = '';

    container.style.display = 'none';

  }


  /*
   * =========================================================
   * CARGAR PROYECTOS
   * =========================================================
   */

  async function cargarProyectos() {

    const tbody =
      document.getElementById(
        'projectsTable'
      );


    tbody.innerHTML =
      '<tr><td colspan="7">Cargando...</td></tr>';


    const {
      data,
      error
    } =
      await supabaseClient
        .from('proyectos')
        .select('*')
        .order(
          'created_at',
          {
            ascending: false
          }
        );


    if (error) {

      tbody.innerHTML =
        `<tr>
          <td colspan="7">
            Error: ${escapeHtml(error.message)}
          </td>
        </tr>`;

      return;

    }


    if (!data || data.length === 0) {

      tbody.innerHTML =
        `<tr>
          <td colspan="7" class="empty">
            No hay proyectos registrados.
          </td>
        </tr>`;

      return;

    }


    tbody.innerHTML =
      data.map(project => {

        const destacado =
          project.destacado
            ? 'Sí'
            : 'No';


        return `
          <tr>

            <td>
              ${escapeHtml(project.nombre)}
            </td>

            <td>
              ${escapeHtml(project.categoria)}
            </td>

            <td>
              ${escapeHtml(project.ubicacion)}
            </td>

            <td>
              ${escapeHtml(project.precio)}
            </td>

            <td>
              ${escapeHtml(project.estado)}
            </td>

            <td>
              ${destacado}
            </td>

            <td>

              <div class="actions">

                <button
                  class="primary small"
                  type="button"
                  onclick="editarProyecto('${escapeHtml(project.id)}')"
                >
                  Editar
                </button>

                <button
                  class="danger small"
                  type="button"
                  onclick="eliminarProyecto('${escapeHtml(project.id)}')"
                >
                  Eliminar
                </button>

              </div>

            </td>

          </tr>
        `;

      }).join('');

  }


  /*
   * =========================================================
   * EDITAR PROYECTO
   * =========================================================
   */

  async function editarProyecto(id) {

    clearMessage();


    const {
      data,
      error
    } =
      await supabaseClient
        .from('proyectos')
        .select('*')
        .eq('id', id)
        .single();


    if (error) {

      showMessage(
        'No se pudo cargar el proyecto: ' +
        error.message,
        'error'
      );

      return;

    }


    if (!data) {

      showMessage(
        'No se encontró el proyecto.',
        'error'
      );

      return;

    }


    moduleState.projectEdit =
      data.id;


    moduleState.projectImageOriginal =
      data.imagen_principal || null;


    document.getElementById('formTitle')
      .textContent =
        'Editar proyecto';


    document.getElementById('prNombre').value =
      data.nombre || '';


    document.getElementById('prCategoria').value =
      data.categoria || '';


    document.getElementById('prUbicacion').value =
      data.ubicacion || '';


    document.getElementById('prPrecio').value =
      data.precio || '';


    document.getElementById('prWhatsapp').value =
      data.whatsapp || '';


    document.getElementById('prEstado').value =
      data.estado || 'Publicado';


    document.getElementById('prImagen').value =
      '';


    document.getElementById('prDestacado').value =
      data.destacado
        ? 'true'
        : 'false';


    document.getElementById('prDesc').value =
      data.descripcion_corta || '';


    if (data.imagen_principal) {

      mostrarImagenActual(
        data.imagen_principal
      );

    } else {

      ocultarImagenActual();

    }


    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });

  }


  /*
   * =========================================================
   * GUARDAR / ACTUALIZAR PROYECTO
   * =========================================================
   */

  async function guardarProyecto() {

    clearMessage();


    const nombre =
      val('prNombre');


    if (!nombre) {

      showMessage(
        'El nombre del proyecto es obligatorio.',
        'error'
      );

      return;

    }


    const boton =
      document.getElementById(
        'saveProjectBtn'
      );


    boton.disabled = true;

    boton.textContent =
      'Guardando...';


    try {

      const file =
        document.getElementById(
          'prImagen'
        ).files[0] || null;


      let imagenPrincipal =
        moduleState.projectImageOriginal;


      /*
       * Si seleccionamos una nueva imagen,
       * se sube y reemplaza la anterior.
       */

      if (file) {

        imagenPrincipal =
          await guardarImagenProyecto(
            file
          );

      }


      const payload = {

        nombre: nombre,

        categoria:
          val('prCategoria'),

        ubicacion:
          val('prUbicacion'),

        precio:
          val('prPrecio'),

        whatsapp:
          val('prWhatsapp'),

        estado:
          val('prEstado'),

        imagen_principal:
          imagenPrincipal,

        destacado:
          boolVal('prDestacado'),

        descripcion_corta:
          val('prDesc')

      };


      /*
       * EDITAR
       */

      if (moduleState.projectEdit) {

        const {
          error
        } =
          await supabaseClient
            .from('proyectos')
            .update(payload)
            .eq(
              'id',
              moduleState.projectEdit
            );


        if (error) {
          throw error;
        }


        showMessage(
          'Proyecto actualizado correctamente.',
          'success'
        );

      }


      /*
       * NUEVO
       */

      else {

        const {
          error
        } =
          await supabaseClient
            .from('proyectos')
            .insert(payload);


        if (error) {
          throw error;
        }


        showMessage(
          'Proyecto creado correctamente.',
          'success'
        );

      }


      await cargarProyectos();


      setTimeout(() => {

        limpiarFormularioProyecto();

      }, 800);


    }

    catch (error) {

      console.error(error);

      showMessage(
        'Error al guardar: ' +
        (error.message || error),
        'error'
      );

    }

    finally {

      boton.disabled = false;

      boton.textContent =
        'Guardar proyecto';

    }

  }


  /*
   * =========================================================
   * ELIMINAR PROYECTO
   * =========================================================
   */

  async function eliminarProyecto(id) {

    const confirmar =
      confirm(
        '¿Estás seguro de eliminar este proyecto?'
      );


    if (!confirmar) {
      return;
    }


    const {
      error
    } =
      await supabaseClient
        .from('proyectos')
        .delete()
        .eq('id', id);


    if (error) {

      showMessage(
        'No se pudo eliminar: ' +
        error.message,
        'error'
      );

      return;

    }


    await cargarProyectos();


    showMessage(
      'Proyecto eliminado correctamente.',
      'success'
    );

  }


  /*
   * =========================================================
   * EVENTOS
   * =========================================================
   */

  document
    .getElementById('saveProjectBtn')
    .addEventListener(
      'click',
      guardarProyecto
    );


  document
    .getElementById('cancelProjectBtn')
    .addEventListener(
      'click',
      limpiarFormularioProyecto
    );


  document
    .getElementById('newProjectBtn')
    .addEventListener(
      'click',
      limpiarFormularioProyecto
    );


  /*
   * Vista previa cuando se selecciona
   * una nueva imagen.
   */

  document
    .getElementById('prImagen')
    .addEventListener(
      'change',
      function () {

        const file =
          this.files[0];

        if (!file) {
          return;
        }


        const url =
          URL.createObjectURL(file);


        document
          .getElementById(
            'imagenActualPreview'
          )
          .src = url;


        document
          .getElementById(
            'imagenActual'
          )
          .style.display = 'block';

      }
    );


  /*
   * =========================================================
   * COMPATIBILIDAD CON EL ADMIN ANTERIOR
   * =========================================================
   *
   * Si tu tabla anterior llamaba:
   *
   * editRecord('proyectos', id)
   *
   * ahora también funcionará.
   */

  window.editRecord =
    function (table, id) {

      if (table === 'proyectos') {

        editarProyecto(id);

        return;

      }


      alert(
        'La edición de "' +
        table +
        '" todavía utiliza el formulario correspondiente.'
      );

    };


  /*
   * =========================================================
   * INICIO
   * =========================================================
   */

  cargarProyectos();

</script>

</body>
</html>

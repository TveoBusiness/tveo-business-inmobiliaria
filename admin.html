<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TVEO Business | Administración</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #07111f;
      color: #fff;
    }

    .container {
      width: min(1100px, 94%);
      margin: 35px auto;
    }

    h1 {
      margin: 0 0 8px;
    }

    h2 {
      margin-top: 0;
    }

    .subtitle {
      color: #9ca9b8;
      margin-bottom: 25px;
    }

    .card {
      background: #101d2d;
      border: 1px solid #263b52;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: bold;
      color: #dce6f0;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 9px;
      border: 1px solid #30465e;
      background: #081522;
      color: #fff;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #4d8dcc;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .primary {
      background: #1683d8;
      color: #fff;
    }

    .secondary {
      background: #26384c;
      color: #fff;
    }

    .danger {
      background: #a93434;
      color: #fff;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: #123d29;
      color: #8ff0ba;
    }

    .message.error {
      background: #451c1c;
      color: #ffaaaa;
    }

    .image-preview {
      display: none;
      margin-top: 12px;
    }

    .image-preview img {
      width: 220px;
      height: 140px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #30465e;
      display: block;
    }

    .image-label {
      color: #9ca9b8;
      margin-bottom: 7px;
      font-size: 14px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid #25384d;
      vertical-align: middle;
    }

    th {
      color: #8db8dc;
    }

    .actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .small {
      padding: 8px 12px;
      font-size: 13px;
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: #8c9bab;
    }

    .status {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 6px;
      background: #26384c;
      font-size: 12px;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      th,
      td {
        white-space: nowrap;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>TVEO Business</h1>

  <div class="subtitle">
    Administración de proyectos inmobiliarios
  </div>


  <!-- =====================================================
       FORMULARIO DE PROYECTO
       ===================================================== -->

  <div class="card">

    <h2 id="formTitle">
      Nuevo proyecto
    </h2>

    <div class="form-grid">

      <div class="field">
        <label for="prNombre">
          Nombre
        </label>

        <input
          id="prNombre"
          type="text"
          placeholder="Nombre del proyecto"
        >
      </div>


      <div class="field">
        <label for="prCategoria">
          Categoría
        </label>

        <input
          id="prCategoria"
          type="text"
          placeholder="Urbanización, residencial, casas..."
        >
      </div>


      <div class="field">
        <label for="prUbicacion">
          Ubicación
        </label>

        <input
          id="prUbicacion"
          type="text"
          placeholder="Ubicación"
        >
      </div>


      <div class="field">
        <label for="prPrecio">
          Precio
        </label>

        <input
          id="prPrecio"
          type="text"
          placeholder="Precio"
        >
      </div>


      <div class="field">
        <label for="prWhatsapp">
          WhatsApp
        </label>

        <input
          id="prWhatsapp"
          type="text"
          placeholder="Número de WhatsApp"
        >
      </div>


      <div class="field">
        <label for="prEstado">
          Estado
        </label>

        <select id="prEstado">
          <option value="Publicado">Publicado</option>
          <option value="Borrador">Borrador</option>
          <option value="Oculto">Oculto</option>
        </select>
      </div>


      <div class="field">

        <label for="prImagen">
          Imagen principal
        </label>

        <input
          id="prImagen"
          type="file"
          accept="image/jpeg,image/png,image/webp"
        >

        <div
          id="imagenActual"
          class="image-preview"
        >

          <div class="image-label">
            Imagen actual:
          </div>

          <img
            id="imagenActualPreview"
            src=""
            alt="Imagen del proyecto"
          >

        </div>

      </div>


      <div class="field">

        <label for="prDestacado">
          Proyecto destacado
        </label>

        <select id="prDestacado">

          <option value="false">
            No
          </option>

          <option value="true">
            Sí
          </option>

        </select>

      </div>


      <div class="field full">

        <label for="prDesc">
          Descripción corta
        </label>

        <textarea
          id="prDesc"
          placeholder="Descripción del proyecto..."
        ></textarea>

      </div>

    </div>


    <div class="buttons">

      <button
        id="saveProjectBtn"
        class="primary"
        type="button"
      >
        Guardar proyecto
      </button>


      <button
        id="newProjectBtn"
        class="secondary"
        type="button"
      >
        Nuevo proyecto
      </button>


      <button
        id="cancelProjectBtn"
        class="secondary"
        type="button"
      >
        Cancelar
      </button>

    </div>


    <div
      id="projectMsg"
      class="message"
    ></div>

  </div>



  <!-- =====================================================
       LISTA DE PROYECTOS
       ===================================================== -->

  <div class="card">

    <h2>
      Proyectos registrados
    </h2>

    <div class="table-wrapper">

      <table>

        <thead>

          <tr>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Ubicación</th>
            <th>Precio</th>
            <th>Estado</th>
            <th>Destacado</th>
            <th>Acciones</th>
          </tr>

        </thead>

        <tbody id="projectsTable"></tbody>

      </table>

    </div>

  </div>

</div>



<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
  'https://jefvmwhkalypvrpiwcuj.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_yj7GqpJpBjtzemuSnke7mQ_bXzeReDy';

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   ESTADO DEL FORMULARIO
   ========================================================= */

let projectEditId = null;

let projectOriginalImage = null;


/* =========================================================
   FUNCIONES GENERALES
   ========================================================= */

function getValue(id) {

  const element =
    document.getElementById(id);

  return element
    ? element.value.trim()
    : '';

}


function escapeHtml(value) {

  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


function showMessage(message, type) {

  const box =
    document.getElementById('projectMsg');

  box.textContent = message;

  box.className =
    'message show ' + type;

}


function clearMessage() {

  const box =
    document.getElementById('projectMsg');

  box.textContent = '';

  box.className = 'message';

}


/* =========================================================
   URL PÚBLICA DE SUPABASE STORAGE
   ========================================================= */

function publicImageUrl(path) {

  if (!path) {
    return '';
  }

  if (/^https?:\/\//i.test(path)) {
    return path;
  }

  const result =
    supabaseClient
      .storage
      .from('inmobiliaria')
      .getPublicUrl(path);

  return result.data.publicUrl || '';

}


/* =========================================================
   MOSTRAR IMAGEN
   ========================================================= */

function mostrarImagen(path) {

  const box =
    document.getElementById(
      'imagenActual'
    );

  const image =
    document.getElementById(
      'imagenActualPreview'
    );

  const url =
    publicImageUrl(path);

  if (!url) {

    box.style.display = 'none';

    image.src = '';

    return;
  }

  image.src = url;

  box.style.display = 'block';

}


function ocultarImagen() {

  const box =
    document.getElementById(
      'imagenActual'
    );

  const image =
    document.getElementById(
      'imagenActualPreview'
    );

  image.src = '';

  box.style.display = 'none';

}


/* =========================================================
   SUBIR IMAGEN
   ========================================================= */

async function subirImagenProyecto(file) {

  if (!file) {
    return null;
  }

  const extension =
    (
      file.name
        .split('.')
        .pop() || 'jpg'
    ).toLowerCase();

  const nombreArchivo =
    Date.now() +
    '-' +
    Math.random()
      .toString(36)
      .substring(2, 10) +
    '.' +
    extension;

  const path =
    'proyectos/' +
    nombreArchivo;


  const {
    error
  } =
    await supabaseClient
      .storage
      .from('inmobiliaria')
      .upload(
        path,
        file,
        {
          cacheControl: '3600',
          upsert: false,
          contentType: file.type
        }
      );


  if (error) {
    throw error;
  }


  return path;

}


/* =========================================================
   LIMPIAR FORMULARIO
   ========================================================= */

function nuevoProyecto() {

  projectEditId = null;

  projectOriginalImage = null;


  document.getElementById(
    'formTitle'
  ).textContent =
    'Nuevo proyecto';


  document.getElementById(
    'prNombre'
  ).value = '';


  document.getElementById(
    'prCategoria'
  ).value = '';


  document.getElementById(
    'prUbicacion'
  ).value = '';


  document.getElementById(
    'prPrecio'
  ).value = '';


  document.getElementById(
    'prWhatsapp'
  ).value = '';


  document.getElementById(
    'prEstado'
  ).value =
    'Publicado';


  document.getElementById(
    'prDestacado'
  ).value =
    'false';


  document.getElementById(
    'prDesc'
  ).value = '';


  document.getElementById(
    'prImagen'
  ).value = '';


  ocultarImagen();

  clearMessage();

}


/* =========================================================
   CARGAR PROYECTOS
   ========================================================= */

async function cargarProyectos() {

  const tbody =
    document.getElementById(
      'projectsTable'
    );


  tbody.innerHTML = `
    <tr>
      <td colspan="7">
        Cargando proyectos...
      </td>
    </tr>
  `;


  const {
    data,
    error
  } =
    await supabaseClient
      .from('proyectos')
      .select('*');


  if (error) {

    tbody.innerHTML = `
      <tr>
        <td colspan="7">
          Error al cargar proyectos:
          ${escapeHtml(error.message)}
        </td>
      </tr>
    `;

    console.error(error);

    return;
  }


  if (!data || data.length === 0) {

    tbody.innerHTML = `
      <tr>
        <td
          colspan="7"
          class="empty"
        >
          No hay proyectos registrados.
        </td>
      </tr>
    `;

    return;
  }


  tbody.innerHTML =
    data.map(project => {

      return `
        <tr>

          <td>
            ${escapeHtml(project.nombre)}
          </td>

          <td>
            ${escapeHtml(project.categoria)}
          </td>

          <td>
            ${escapeHtml(project.ubicacion)}
          </td>

          <td>
            ${escapeHtml(project.precio)}
          </td>

          <td>
            <span class="status">
              ${escapeHtml(project.estado)}
            </span>
          </td>

          <td>
            ${project.destacado ? 'Sí' : 'No'}
          </td>

          <td>

            <div class="actions">

              <button
                class="primary small"
                type="button"
                data-action="edit"
                data-id="${escapeHtml(project.id)}"
              >
                Editar
              </button>

              <button
                class="danger small"
                type="button"
                data-action="delete"
                data-id="${escapeHtml(project.id)}"
              >
                Eliminar
              </button>

            </div>

          </td>

        </tr>
      `;

    }).join('');

}


/* =========================================================
   EDITAR PROYECTO
   ========================================================= */

async function editarProyecto(id) {

  clearMessage();


  const {
    data,
    error
  } =
    await supabaseClient
      .from('proyectos')
      .select('*')
      .eq('id', id)
      .single();


  if (error) {

    console.error(error);

    showMessage(
      'No se pudo abrir el proyecto: ' +
      error.message,
      'error'
    );

    return;
  }


  if (!data) {

    showMessage(
      'No se encontró el proyecto.',
      'error'
    );

    return;
  }


  projectEditId =
    data.id;


  projectOriginalImage =
    data.imagen_principal || null;


  document.getElementById(
    'formTitle'
  ).textContent =
    'Editar proyecto';


  document.getElementById(
    'prNombre'
  ).value =
    data.nombre || '';


  document.getElementById(
    'prCategoria'
  ).value =
    data.categoria || '';


  document.getElementById(
    'prUbicacion'
  ).value =
    data.ubicacion || '';


  document.getElementById(
    'prPrecio'
  ).value =
    data.precio || '';


  document.getElementById(
    'prWhatsapp'
  ).value =
    data.whatsapp || '';


  document.getElementById(
    'prEstado'
  ).value =
    data.estado || 'Publicado';


  document.getElementById(
    'prDestacado'
  ).value =
    data.destacado
      ? 'true'
      : 'false';


  document.getElementById(
    'prDesc'
  ).value =
    data.descripcion_corta || '';


  /*
   * El navegador no permite colocar
   * automáticamente un archivo en
   * input type=file.
   */

  document.getElementById(
    'prImagen'
  ).value = '';


  if (projectOriginalImage) {

    mostrarImagen(
      projectOriginalImage
    );

  } else {

    ocultarImagen();

  }


  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });

}


/* =========================================================
   GUARDAR PROYECTO
   ========================================================= */

async function guardarProyecto() {

  clearMessage();


  const nombre =
    getValue('prNombre');


  if (!nombre) {

    showMessage(
      'El nombre del proyecto es obligatorio.',
      'error'
    );

    return;
  }


  const boton =
    document.getElementById(
      'saveProjectBtn'
    );


  boton.disabled = true;

  boton.textContent =
    'Guardando...';


  try {

    const file =
      document.getElementById(
        'prImagen'
      ).files[0] || null;


    let imagenPrincipal =
      projectOriginalImage;


    /*
     * Si el usuario eligió una
     * nueva imagen, la subimos.
     */

    if (file) {

      imagenPrincipal =
        await subirImagenProyecto(
          file
        );

    }


    const payload = {

      nombre:
        nombre,

      categoria:
        getValue('prCategoria'),

      ubicacion:
        getValue('prUbicacion'),

      precio:
        getValue('prPrecio'),

      whatsapp:
        getValue('prWhatsapp'),

      estado:
        getValue('prEstado'),

      imagen_principal:
        imagenPrincipal,

      destacado:
        document.getElementById(
          'prDestacado'
        ).value === 'true',

      descripcion_corta:
        getValue('prDesc')

    };


    /*
     * ACTUALIZAR
     */

    if (projectEditId) {

      const {
        error
      } =
        await supabaseClient
          .from('proyectos')
          .update(payload)
          .eq(
            'id',
            projectEditId
          );


      if (error) {
        throw error;
      }


      showMessage(
        'Proyecto actualizado correctamente.',
        'success'
      );

    }


    /*
     * CREAR
     */

    else {

      const {
        error
      } =
        await supabaseClient
          .from('proyectos')
          .insert(payload);


      if (error) {
        throw error;
      }


      showMessage(
        'Proyecto creado correctamente.',
        'success'
      );

    }


    await cargarProyectos();


    setTimeout(
      nuevoProyecto,
      1000
    );

  }

  catch (error) {

    console.error(
      'ERROR AL GUARDAR:',
      error
    );


    showMessage(
      'Error al guardar: ' +
      (error.message || error),
      'error'
    );

  }

  finally {

    boton.disabled = false;

    boton.textContent =
      'Guardar proyecto';

  }

}


/* =========================================================
   ELIMINAR PROYECTO
   ========================================================= */

async function eliminarProyecto(id) {

  const confirmar =
    confirm(
      '¿Seguro que deseas eliminar este proyecto?'
    );


  if (!confirmar) {
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from('proyectos')
      .delete()
      .eq(
        'id',
        id
      );


  if (error) {

    console.error(error);

    showMessage(
      'No se pudo eliminar: ' +
      error.message,
      'error'
    );

    return;
  }


  await cargarProyectos();


  showMessage(
    'Proyecto eliminado correctamente.',
    'success'
  );

}


/* =========================================================
   EVENTOS
   ========================================================= */

document
  .getElementById(
    'saveProjectBtn'
  )
  .addEventListener(
    'click',
    guardarProyecto
  );


document
  .getElementById(
    'newProjectBtn'
  )
  .addEventListener(
    'click',
    nuevoProyecto
  );


document
  .getElementById(
    'cancelProjectBtn'
  )
  .addEventListener(
    'click',
    nuevoProyecto
  );


/*
 * Vista previa de nueva imagen
 */

document
  .getElementById(
    'prImagen'
  )
  .addEventListener(
    'change',
    function () {

      const file =
        this.files[0];


      if (!file) {

        if (projectOriginalImage) {

          mostrarImagen(
            projectOriginalImage
          );

        } else {

          ocultarImagen();

        }

        return;
      }


      const url =
        URL.createObjectURL(
          file
        );


      document.getElementById(
        'imagenActualPreview'
      ).src = url;


      document.getElementById(
        'imagenActual'
      ).style.display = 'block';

    }
  );


/*
 * Botones Editar / Eliminar
 */

document
  .getElementById(
    'projectsTable'
  )
  .addEventListener(
    'click',
    function(event) {

      const button =
        event.target.closest(
          'button[data-action]'
        );


      if (!button) {
        return;
      }


      const action =
        button.dataset.action;


      const id =
        button.dataset.id;


      if (action === 'edit') {

        editarProyecto(id);

      }


      if (action === 'delete') {

        eliminarProyecto(id);

      }

    }
  );


/* =========================================================
   INICIAR
   ========================================================= */

cargarProyectos();

</script>

</body>
</html>

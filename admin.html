<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TVEO Business | Administración</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#07111f;
  color:#fff;
}

.container{
  width:min(1150px,94%);
  margin:30px auto;
}

h1{margin:0 0 5px}
h2{margin-top:0}

.subtitle{
  color:#9ca9b8;
  margin-bottom:25px;
}

.card{
  background:#101d2d;
  border:1px solid #263b52;
  border-radius:16px;
  padding:25px;
  margin-bottom:25px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.full{grid-column:1/-1}

label{
  font-weight:bold;
  color:#dce6f0;
}

input,select,textarea{
  width:100%;
  padding:12px;
  border-radius:9px;
  border:1px solid #30465e;
  background:#081522;
  color:#fff;
  outline:none;
}

textarea{
  min-height:120px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#1683d8;
}

.buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:22px;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 17px;
  cursor:pointer;
  font-weight:bold;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.primary{
  background:#1683d8;
  color:white;
}

.secondary{
  background:#26384c;
  color:white;
}

.danger{
  background:#a93434;
  color:white;
}

.message{
  display:none;
  margin-top:18px;
  padding:12px;
  border-radius:8px;
}

.message.show{display:block}

.message.success{
  background:#123d29;
  color:#8ff0ba;
}

.message.error{
  background:#451c1c;
  color:#ffaaaa;
}

.preview{
  display:none;
  margin-top:10px;
}

.preview img{
  width:240px;
  height:150px;
  object-fit:cover;
  border-radius:12px;
  border:1px solid #30465e;
}

.table-wrapper{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:12px 10px;
  text-align:left;
  border-bottom:1px solid #25384d;
  vertical-align:middle;
}

th{
  color:#8db8dc;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.small{
  padding:8px 12px;
  font-size:13px;
}

.status{
  display:inline-block;
  padding:5px 8px;
  border-radius:6px;
  background:#26384c;
  font-size:12px;
}

.empty{
  text-align:center;
  padding:25px;
  color:#8c9bab;
}

.loading{
  color:#9ca9b8;
}

@media(max-width:700px){
  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  th,td{
    white-space:nowrap;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>TVEO Business</h1>

<div class="subtitle">
Administración de proyectos inmobiliarios
</div>

<!-- FORMULARIO -->

<div class="card">

<h2 id="formTitle">Nuevo proyecto</h2>

<div class="form-grid">

<div class="field">
<label>Nombre</label>
<input id="prNombre" type="text">
</div>

<div class="field">
<label>Categoría</label>
<input id="prCategoria" type="text">
</div>

<div class="field">
<label>Ubicación</label>
<input id="prUbicacion" type="text">
</div>

<div class="field">
<label>Precio</label>
<input id="prPrecio" type="text">
</div>

<div class="field">
<label>WhatsApp</label>
<input id="prWhatsapp" type="text">
</div>

<div class="field">
<label>Estado</label>

<select id="prEstado">
<option value="Publicado">Publicado</option>
<option value="Borrador">Borrador</option>
<option value="Oculto">Oculto</option>
</select>

</div>

<div class="field">

<label>Imagen principal</label>

<input
id="prImagen"
type="file"
accept="image/jpeg,image/png,image/webp"
>

<div id="previewBox" class="preview">

<img
id="previewImage"
src=""
alt="Imagen"
>

</div>

</div>

<div class="field">

<label>Proyecto destacado</label>

<select id="prDestacado">
<option value="false">No</option>
<option value="true">Sí</option>
</select>

</div>

<div class="field full">

<label>Descripción corta</label>

<textarea id="prDesc"></textarea>

</div>

</div>

<div class="buttons">

<button
id="saveBtn"
class="primary"
type="button"
>
Guardar proyecto
</button>

<button
id="newBtn"
class="secondary"
type="button"
>
Nuevo
</button>

</div>

<div id="msg" class="message"></div>

</div>


<!-- LISTA -->

<div class="card">

<h2>Proyectos registrados</h2>

<div class="table-wrapper">

<table>

<thead>

<tr>
<th>Nombre</th>
<th>Categoría</th>
<th>Ubicación</th>
<th>Precio</th>
<th>Estado</th>
<th>Destacado</th>
<th>Acciones</th>
</tr>

</thead>

<tbody id="projectsTable">

<tr>
<td colspan="7" class="loading">
Cargando...
</td>
</tr>

</tbody>

</table>

</div>

</div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
'https://jefvmwhkalypvrpiwcuj.supabase.co';

const SUPABASE_KEY =
'sb_publishable_yj7GqpJpBjtzemuSnke7mQ_bXzeReDy';

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================
   ESTADO
========================================= */

let editId = null;
let originalImage = '';


/* =========================================
   ELEMENTOS
========================================= */

const $ = id =>
document.getElementById(id);


/* =========================================
   MENSAJES
========================================= */

function message(text,type){

const box = $('msg');

box.textContent = text;

box.className =
'message show ' + type;

}


/* =========================================
   ESCAPE HTML
========================================= */

function esc(value){

return String(value ?? '')
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#039;');

}


/* =========================================
   URL IMAGEN
========================================= */

function imageUrl(path){

if(!path) return '';

if(/^https?:\/\//i.test(path))
return path;

return supabaseClient
.storage
.from('inmobiliaria')
.getPublicUrl(path)
.data
.publicUrl || '';

}


/* =========================================
   PREVIEW
========================================= */

function showPreview(path){

const url=imageUrl(path);

if(!url){

$('previewBox').style.display='none';
$('previewImage').src='';
return;

}

$('previewImage').src=url;
$('previewBox').style.display='block';

}


/* =========================================
   NUEVO
========================================= */

function nuevo(){

editId=null;
originalImage='';

$('formTitle').textContent='Nuevo proyecto';

$('prNombre').value='';
$('prCategoria').value='';
$('prUbicacion').value='';
$('prPrecio').value='';
$('prWhatsapp').value='';
$('prEstado').value='Publicado';
$('prDestacado').value='false';
$('prDesc').value='';
$('prImagen').value='';

$('previewBox').style.display='none';
$('previewImage').src='';

$('msg').className='message';
$('msg').textContent='';

}


/* =========================================
   CARGAR
========================================= */

async function cargar(){

const tbody=$('projectsTable');

tbody.innerHTML=
'<tr><td colspan="7" class="loading">Cargando proyectos...</td></tr>';

const {data,error}=await supabaseClient
.from('proyectos')
.select('*')
.order('nombre');

if(error){

tbody.innerHTML=
`<tr>
<td colspan="7">
Error: ${esc(error.message)}
</td>
</tr>`;

console.error(error);
return;

}

if(!data || !data.length){

tbody.innerHTML=
'<tr><td colspan="7" class="empty">No hay proyectos registrados.</td></tr>';

return;

}

tbody.innerHTML=data.map(p=>`

<tr>

<td>${esc(p.nombre)}</td>

<td>${esc(p.categoria)}</td>

<td>${esc(p.ubicacion)}</td>

<td>${esc(p.precio)}</td>

<td>
<span class="status">
${esc(p.estado)}
</span>
</td>

<td>
${p.destacado ? 'Sí' : 'No'}
</td>

<td>

<div class="actions">

<button
class="primary small"
onclick="editar('${esc(p.id)}')"
>
Editar
</button>

<button
class="danger small"
onclick="eliminar('${esc(p.id)}')"
>
Eliminar
</button>

</div>

</td>

</tr>

`).join('');

}


/* =========================================
   EDITAR
========================================= */

async function editar(id){

$('msg').className='message';

const {data,error}=await supabaseClient
.from('proyectos')
.select('*')
.eq('id',id)
.single();

if(error){

console.error(error);

message(
'No se pudo cargar el proyecto: '+
error.message,
'error'
);

return;

}

if(!data){

message(
'No se encontró el proyecto.',
'error'
);

return;

}

editId=data.id;

originalImage=data.imagen_principal || '';

$('formTitle').textContent=
'Editar proyecto';

$('prNombre').value=
data.nombre || '';

$('prCategoria').value=
data.categoria || '';

$('prUbicacion').value=
data.ubicacion || '';

$('prPrecio').value=
data.precio || '';

$('prWhatsapp').value=
data.whatsapp || '';

$('prEstado').value=
data.estado || 'Publicado';

$('prDestacado').value=
data.destacado ? 'true':'false';

$('prDesc').value=
data.descripcion_corta || '';

$('prImagen').value='';

showPreview(originalImage);

window.scrollTo({
top:0,
behavior:'smooth'
});

}


/* =========================================
   SUBIR IMAGEN
========================================= */

async function subirImagen(file){

const extension=
(file.name.split('.').pop() || 'jpg')
.toLowerCase();

const filename=
Date.now()+
'-'+
Math.random()
.toString(36)
.substring(2,10)+
'.'+
extension;

const path=
'proyectos/'+filename;

const {error}=await supabaseClient
.storage
.from('inmobiliaria')
.upload(
path,
file,
{
upsert:false,
contentType:file.type,
cacheControl:'3600'
}
);

if(error) throw error;

return path;

}


/* =========================================
   GUARDAR
========================================= */

async function guardar(){

$('msg').className='message';

const nombre=
$('prNombre').value.trim();

if(!nombre){

message(
'El nombre del proyecto es obligatorio.',
'error'
);

return;

}

const btn=$('saveBtn');

btn.disabled=true;
btn.textContent='Guardando...';

try{

let imagen=originalImage;

const file=
$('prImagen').files[0];

if(file){

imagen=await subirImagen(file);

}

const datos={

nombre:nombre,

categoria:
$('prCategoria').value.trim(),

ubicacion:
$('prUbicacion').value.trim(),

precio:
$('prPrecio').value.trim(),

whatsapp:
$('prWhatsapp').value.trim(),

estado:
$('prEstado').value,

imagen_principal:
imagen,

destacado:
$('prDestacado').value==='true',

descripcion_corta:
$('prDesc').value.trim()

};


/* EDITAR */

if(editId){

const {error}=await supabaseClient
.from('proyectos')
.update(datos)
.eq('id',editId);

if(error) throw error;

message(
'Proyecto actualizado correctamente.',
'success'
);

}

/* CREAR */

else{

const {error}=await supabaseClient
.from('proyectos')
.insert(datos);

if(error) throw error;

message(
'Proyecto creado correctamente.',
'success'
);

}

await cargar();

setTimeout(nuevo,1200);

}catch(error){

console.error(error);

message(
'Error: '+(error.message || error),
'error'
);

}finally{

btn.disabled=false;
btn.textContent='Guardar proyecto';

}

}


/* =========================================
   ELIMINAR
========================================= */

async function eliminar(id){

if(!confirm(
'¿Seguro que deseas eliminar este proyecto?'
)) return;

const {error}=await supabaseClient
.from('proyectos')
.delete()
.eq('id',id);

if(error){

console.error(error);

message(
'No se pudo eliminar: '+error.message,
'error'
);

return;

}

message(
'Proyecto eliminado correctamente.',
'success'
);

await cargar();

}


/* =========================================
   PREVISUALIZACIÓN
========================================= */

$('prImagen').addEventListener(
'change',
function(){

const file=this.files[0];

if(!file){

showPreview(originalImage);
return;

}

const url=
URL.createObjectURL(file);

$('previewImage').src=url;
$('previewBox').style.display='block';

}
);


/* =========================================
   BOTONES
========================================= */

$('saveBtn')
.addEventListener('click',guardar);

$('newBtn')
.addEventListener('click',nuevo);


/* =========================================
   INICIO
========================================= */

cargar();

</script>

</body>
</html>
